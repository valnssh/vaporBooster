x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  proxy:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile.nginx
    environment:
      HOURS_DOMAIN: ${HOURS_DOMAIN:?Run setup.py}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Run setup.py}
    ports:
      - '${HTTPS_BIND_IP:?Run setup.py}:80:80'
      - '${HTTPS_BIND_IP:?Run setup.py}:443:443'
    # Namespaced network setting permits UID1000 to bind443 without capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    volumes:
      - ${PRIVATE_DIR:?Run setup.py}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PRIVATE_DIR}/pki/ca.pem:/run/ca/ca.pem:ro
      - ${CERTS_DIR:?Run setup.py}/nginx:/run/tls:ro
    networks:
      edge:
        ipv4_address: ${PROXY_IP:?Run setup.py}
        aliases:
          - ${HOURS_DOMAIN}
          - ${AUTH_DOMAIN}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    restart: unless-stopped

  vaporbooster:
    logging: *logging
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ORIGIN: https://${HOURS_DOMAIN}
      BETTER_AUTH_URL: https://${HOURS_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run setup.py}
      OIDC_PROVIDER_ID: keycloak
      OIDC_PROVIDER_NAME: Keycloak
      OIDC_CLIENT_ID: hoursbooster
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run setup.py}
      OIDC_DISCOVERY_URL: https://${AUTH_DOMAIN}/realms/hours/.well-known/openid-configuration
      STEAM_LOGIN_ENABLED: 'true'
      STEAM_ALLOWED_IDS: ${STEAM_ALLOWED_IDS:?Set SteamID64 allowlist}
      ALLOW_ANONYMOUS: 'false'
      DATABASE_URL: postgresql://hoursbooster:${APP_DB_PASSWORD:?Run setup.py}@postgres:5432/hoursbooster
      DATABASE_CA_FILE: /run/tls/ca.pem
      HOST: 0.0.0.0
      PORT: '8443'
      TLS_CERT_FILE: /run/tls/fullchain.pem
      TLS_KEY_FILE: /run/tls/privkey.pem
      DENO_CERT: /run/tls/ca.pem
      NODE_EXTRA_CA_CERTS: /run/tls/ca.pem
      BETTER_AUTH_TELEMETRY: '0'
    volumes:
      # Preserve the old SQLite volume read-only for backup/import.
      - app-data:/data:ro
      - ${PRIVATE_DIR}/pki/vaporbooster:/run/tls:ro
    networks: [edge, database]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    restart: unless-stopped

  keycloak:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    environment:
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'false'
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/fullchain.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/privkey.pem
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${PROXY_IP}
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/run/ca/ca.pem
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:?Run setup.py}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run setup.py}
      KC_CACHE: local
      HOURS_DOMAIN: ${HOURS_DOMAIN}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Run setup.py}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm.json:/opt/keycloak/data/import/hours-realm.json:ro
      - ${PRIVATE_DIR}/pki/keycloak:/run/tls:ro
      - ${PRIVATE_DIR}/pki/ca.pem:/run/ca/ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    restart: unless-stopped

  postgres:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py}
      KEYCLOAK_DB_PASSWORD: ${DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/tls/fullchain.pem
      - -c
      - ssl_key_file=/run/tls/privkey.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl_min_protocol_version=TLSv1.2
      # Keep SQL values/constraint details out of container logs.
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
      - ./init-application.sh:/docker-entrypoint-initdb.d/20-hoursbooster.sh:ro
      - ${PRIVATE_DIR}/pki/postgres:/run/tls:ro
    networks: [database]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'PGPASSWORD="$$KEYCLOAK_DB_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/run/tls/ca.pem psql -h postgres -U keycloak -d keycloak -tAc ''SELECT 1'' | grep -qx 1'
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,uid=999,gid=999,size=8m
    restart: unless-stopped

  sqlite-import:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: sqlite-importer
    # Root only in this short-lived tool, so a root-owned 0600 backup is readable.
    user: '0:0'
    environment:
      DATABASE_URL: postgresql://hoursbooster:${APP_DB_PASSWORD:?Run setup.py}@postgres:5432/hoursbooster
      DATABASE_CA_FILE: /run/ca.pem
    volumes:
      - type: bind
        # Mount the whole snapshot directory so committed WAL pages are included.
        source: ${SQLITE_IMPORT_DIR:-${PRIVATE_DIR}/sqlite-backup}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - ${PRIVATE_DIR}/pki/ca.pem:/run/ca.pem:ro
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?Run setup.py}
          ip_range: ${EDGE_DYNAMIC_RANGE:?Run setup.py}
  database:
    internal: true

volumes:
  app-data:
  keycloak-data:
  postgres-data:
