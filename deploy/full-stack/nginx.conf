worker_processes auto;
pid /tmp/nginx.pid;
# Request errors can contain OIDC callbacks; do not log URLs or cookies.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;

    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /run/ca/ca.pem;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    server { listen 80 default_server; server_name _; return 444; }
    server {
        listen 80;
        server_name ${HOURS_DOMAIN} ${AUTH_DOMAIN};
        return 308 https://$host$request_uri;
    }
    server { listen 443 ssl default_server; ssl_reject_handshake on; }
    server {
        listen 443 ssl;
        server_name ${HOURS_DOMAIN};
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location / {
            set $backend vaporbooster:8443;
            proxy_pass https://$backend;
            proxy_ssl_name vaporbooster;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Forwarded "";
            proxy_set_header Host ${HOURS_DOMAIN};
            proxy_set_header X-Forwarded-Host ${HOURS_DOMAIN};
        }
    }
    server {
        listen 443 ssl;
        server_name ${AUTH_DOMAIN};
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location / {
            set $backend keycloak:8443;
            proxy_pass https://$backend;
            proxy_ssl_name keycloak;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Forwarded "";
            proxy_set_header Host ${AUTH_DOMAIN};
            proxy_set_header X-Forwarded-Host ${AUTH_DOMAIN};
        }
    }
}
