version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /deploy/full-stack]
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
